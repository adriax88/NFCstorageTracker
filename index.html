<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Storage Tracker v1.4</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121318;
      --card-bg: #1c1e24;
      --primary: #bb86fc;
      --primary-variant: #3700b3;
      --secondary: #03dac6;
      --text: #e1e1e6;
      --text-dim: #a0a0b0;
      --danger: #cf6679;
      --border: #2e323e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; max-width: 600px; margin: 0 auto; }
    header { background-color: var(--card-bg); padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    h1 { font-size: 1.2rem; color: var(--primary); }
    .container { padding: 16px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .btn { background: var(--primary); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn-secondary { background: transparent; color: var(--secondary); border: 1px solid var(--secondary); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-block { width: 100%; justify-content: center; margin-top: 8px; }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; background: #0002; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 1rem; }
    .bin-header { display: flex; justify-content: space-between; align-items: center; }
    .item-list { margin-top: 12px; }
    .item-card { background: #252830; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
    .item-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: var(--border); flex-shrink: 0; }
    .item-info { flex-grow: 1; }
    .item-title { font-weight: bold; }
    .item-date { font-size: 0.75rem; color: var(--text-dim); }
    .action-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .hidden { display: none !important; }
    .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1>📦 Storage Tracker</h1>
    <button class="btn btn-secondary" onclick="exportData()">Backup</button>
  </header>

  <div class="container">
    <div class="action-bar">
      <button class="btn btn-block" onclick="startNfcScan()">📡 Scan NFC Tag</button>
      <button class="btn btn-secondary btn-block" onclick="openAddBinModal()">+ New Bin</button>
    </div>

    <div id="mainView">
      <h2>Your Storage Bins</h2>
      <div id="binsList" style="margin-top: 12px;"></div>
    </div>

    <!-- Bin Details View -->
    <div id="binDetailView" class="hidden">
      <button class="btn btn-secondary" onclick="showMainView()" style="margin-bottom: 12px;">← Back to Bins</button>
      <div class="card">
        <div class="bin-header">
          <h2 id="detailBinName">Bin Name</h2>
          <span id="detailBinTag" style="font-size: 0.8rem; color: var(--primary);">Tag: None</span>
        </div>
        <p id="detailBinCategory" style="color: var(--text-dim); font-size: 0.85rem; margin-top: 4px;"></p>
        
        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <button class="btn" onclick="writeNfcTag()">🏷️ Write NFC Tag</button>
          <button class="btn btn-danger" onclick="deleteCurrentBin()">Delete Bin</button>
        </div>
      </div>

      <div class="card">
        <h3>Items in this Bin</h3>
        <button class="btn btn-block" onclick="openAddItemModal()" style="margin-top: 8px;">+ Add Item to Bin</button>
        <div id="itemsContainer" class="item-list"></div>
      </div>
    </div>
  </div>

  <!-- Add Bin Modal -->
  <div id="addBinModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add New Storage Bin</h3>
      <div class="input-group" style="margin-top: 12px;">
        <label>Bin Name / ID</label>
        <input type="text" id="newBinName" placeholder="e.g. Bin #1 - Halloween">
      </div>
      <div class="input-group">
        <label>Category / Location</label>
        <input type="text" id="newBinCategory" placeholder="e.g. Attic, Garage, Closet">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn btn-secondary" onclick="closeModal('addBinModal')">Cancel</button>
        <button class="btn" onclick="saveNewBin()">Save Bin</button>
      </div>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div id="addItemModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Item to Bin</h3>
      <div class="input-group" style="margin-top: 12px;">
        <label>Item Name</label>
        <input type="text" id="newItemName" placeholder="e.g. Christmas Lights">
      </div>
      <div class="input-group">
        <label>Photo (Optional)</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <label class="btn btn-secondary" style="flex: 1; text-align: center; cursor: pointer; justify-content: center; display: inline-flex; align-items: center; margin: 0;">
            📷 Camera
            <input type="file" id="newItemPhotoCamera" accept="image/*" capture="environment" style="display: none;" onchange="updatePhotoStatus('Camera')">
          </label>
          <label class="btn btn-secondary" style="flex: 1; text-align: center; cursor: pointer; justify-content: center; display: inline-flex; align-items: center; margin: 0;">
            🖼️ Gallery
            <input type="file" id="newItemPhotoGallery" accept="image/*" style="display: none;" onchange="updatePhotoStatus('Gallery')">
          </label>
        </div>
        <div id="selectedPhotoName" style="font-size: 0.8rem; color: var(--secondary); margin-top: 6px; text-align: center;"></div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn btn-secondary" type="button" onclick="closeModal('addItemModal')">Cancel</button>
        <button class="btn" type="button" onclick="saveNewItem()">Save Item</button>
      </div>
    </div>
  </div>

  <script>
    let bins = JSON.parse(localStorage.getItem('nfc_storage_bins') || localStorage.getItem('nfc_storage_app_data') || '[]');
    let currentBinId = null;
    let isWritingNFC = false;

    function saveToStorage() {
      localStorage.setItem('nfc_storage_bins', JSON.stringify(bins));
      localStorage.setItem('nfc_storage_app_data', JSON.stringify(bins));
    }

    function renderBins() {
      const list = document.getElementById('binsList');
      list.innerHTML = '';
      if (!bins || bins.length === 0) {
        list.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 20px;">No bins created yet. Tap "+ New Bin" to start!</p>';
        return;
      }
      bins.forEach(bin => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = function() { openBinDetail(bin.id); };
        card.innerHTML = `
          <div class="bin-header">
            <strong>${bin.name}</strong>
            <span style="font-size:0.8rem; color:var(--primary);">${bin.items ? bin.items.length : 0} items</span>
          </div>
          <div style="font-size:0.8rem; color:var(--text-dim); margin-top:4px;">Location: ${bin.category || 'Unassigned'}</div>
        `;
        list.appendChild(card);
      });
    }

    function openAddBinModal() {
      document.getElementById('newBinName').value = '';
      document.getElementById('newBinCategory').value = '';
      document.getElementById('addBinModal').classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function saveNewBin() {
      const name = document.getElementById('newBinName').value.trim();
      const category = document.getElementById('newBinCategory').value.trim();
      if (!name) return alert('Please enter a bin name');

      const newBin = {
        id: 'BIN-' + Date.now(),
        name: name,
        category: category,
        items: []
      };

      bins.push(newBin);
      saveToStorage();
      renderBins();
      closeModal('addBinModal');
      openBinDetail(newBin.id);
    }

    function openBinDetail(binId) {
      currentBinId = binId;
      const bin = bins.find(b => b.id === binId);
      if (!bin) return;

      document.getElementById('detailBinName').innerText = bin.name;
      document.getElementById('detailBinCategory').innerText = 'Location: ' + (bin.category || 'None');
      document.getElementById('detailBinTag').innerText = 'Tag ID: ' + bin.id;

      renderItems(bin);
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('binDetailView').classList.remove('hidden');
    }

    function renderItems(bin) {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      if (!bin.items || bin.items.length === 0) {
        container.innerHTML = '<p style="color: var(--text-dim); font-size:0.85rem; text-align:center; padding: 12px;">This bin is empty.</p>';
        return;
      }

      bin.items.forEach((item, index) => {
        const itemCard = document.createElement('div');
        itemCard.className = 'item-card';
        const imgMarkup = item.photo ? `<img src="${item.photo}" class="item-img">` : `<div class="item-img" style="display:flex;align-items:center;justify-content:center;">📦</div>`;
        itemCard.innerHTML = `
          ${imgMarkup}
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-date">Added: ${item.date}</div>
          </div>
          <button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteItem(${index})">X</button>
        `;
        container.appendChild(itemCard);
      });
    }

    function openAddItemModal() {
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemPhotoCamera').value = '';
      document.getElementById('newItemPhotoGallery').value = '';
      document.getElementById('selectedPhotoName').innerText = '';
      document.getElementById('addItemModal').classList.remove('hidden');
    }

    function updatePhotoStatus(source) {
      const statusDiv = document.getElementById('selectedPhotoName');
      statusDiv.innerText = `✓ Photo attached (${source})`;
    }

    function saveNewItem() {
      const nameInput = document.getElementById('newItemName');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) {
        alert('Please enter an item name');
        return;
      }

      const bin = bins.find(b => b.id === currentBinId);
      if (!bin) {
        alert('Error: Bin not found');
        return;
      }

      if (!bin.items) bin.items = [];

      const cameraInput = document.getElementById('newItemPhotoCamera');
      const galleryInput = document.getElementById('newItemPhotoGallery');
      const dateStr = new Date().toLocaleDateString();
      const photoFile = (cameraInput && cameraInput.files && cameraInput.files[0]) || (galleryInput && galleryInput.files && galleryInput.files[0]);

      if (photoFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          bin.items.push({ name: name, date: dateStr, photo: e.target.result });
          saveToStorage();
          renderItems(bin);
          renderBins();
          closeModal('addItemModal');
        };
        reader.onerror = function() {
          alert('Error reading photo file');
        };
        reader.readAsDataURL(photoFile);
      } else {
        bin.items.push({ name: name, date: dateStr, photo: null });
        saveToStorage();
        renderItems(bin);
        renderBins();
        closeModal('addItemModal');
      }
    }

    function deleteItem(index) {
      const bin = bins.find(b => b.id === currentBinId);
      if (!bin) return;
      bin.items.splice(index, 1);
      saveToStorage();
      renderItems(bin);
      renderBins();
    }

    function deleteCurrentBin() {
      if (!confirm('Are you sure you want to delete this bin?')) return;
      bins = bins.filter(b => b.id !== currentBinId);
      saveToStorage();
      renderBins();
      showMainView();
    }

    function showMainView() {
      document.getElementById('binDetailView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }

    async function writeNfcTag() {
      if (isWritingNFC) return;
      if (!('NDEFReader' in window)) {
        return alert('Web NFC is not supported on this browser/device. Ensure you are using Chrome on Android with HTTPS.');
      }
      try {
        isWritingNFC = true;
        const ndef = new NDEFReader();
        alert('🏷️ Ready to write! Touch the NFC tag to the back of your phone now.');
        await ndef.write({
          records: [{ recordType: "text", data: currentBinId }]
        });
        alert('✅ Success! Bin ID (' + currentBinId + ') written to NFC tag.');
      } catch (error) {
        if (error.name !== 'AbortError') {
          alert('Error writing NFC tag: ' + error);
        }
      } finally {
        isWritingNFC = false;
      }
    }

    async function startNfcScan() {
      if (!('NDEFReader' in window)) {
        return alert('Web NFC is not supported on this browser/device.');
      }
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        alert('📡 Ready to scan! Touch an NFC tag to the back of your phone to open its bin.');

        ndef.addEventListener("reading", ({ message, serialNumber }) => {
          for (const record of message.records) {
            const textDecoder = new TextDecoder(record.encoding);
            const tagData = textDecoder.decode(record.data);
            const foundBin = bins.find(b => b.id === tagData);
            if (foundBin) {
              openBinDetail(foundBin.id);
            } else {
              alert('Scanned Tag ID: ' + tagData + ' - No matching bin found in storage.');
            }
          }
        });
      } catch (error) {
        alert('NFC Scan Error: ' + error);
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bins));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "storage_bins_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    renderBins();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=1.4');
    }
  </script>
</body>
</html>
